<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ex02 - Language Switcher (EN/AR)</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <div class="logo" data-i18n="logo">My Portfolio</div>
        <button id="lang-toggle">العربية</button>
    </header>

    <main>
        <section class="card">
            <h1 data-i18n="welcome">Welcome to my Portfolio</h1>
            <p data-i18n="description">This is an internationalized portfolio demonstrating bidirectional layout (RTL and LTR) support using native JavaScript and semantic HTML5.</p>
        </section>
    </main>
</body>
</html>
